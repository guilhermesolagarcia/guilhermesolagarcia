<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Guilherme Sola Garcia</title>
  <desc id="d">Desenvolvedor frontend que entende UX. Motion, 3D na web e mobile. Último semestre de ADS na FIAP, São Paulo.</desc>
  <style>
    .mono { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace; }
    .sans { font-family: 'Inter','Segoe UI',Helvetica,Arial,sans-serif; }
    .in { animation: up .7s cubic-bezier(.32,.72,0,1) backwards; }
    .d1 { animation-delay: .15s } .d2 { animation-delay: .45s } .d3 { animation-delay: .75s }
    .d4 { animation-delay: 1.05s } .d5 { animation-delay: 1.35s }
    .cursor { animation: blink 1.05s steps(1) infinite; }
    .scan { animation: scan 6s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes up { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    @keyframes blink { 50% { opacity: 0 } }
    @keyframes scan { 0% { transform: translateX(-260px) } 60%,100% { transform: translateX(1260px) } }
    @media (prefers-reduced-motion: reduce) { .in, .cursor { animation: none } .scan { display: none } }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#232A33" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0B0D10" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B0D10"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#C8F135" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C8F135" stop-opacity=".9"/>
      <stop offset="1" stop-color="#C8F135" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="win"><rect x="1" y="1" width="1198" height="418" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#win)">
    <rect width="1200" height="420" fill="#0B0D10"/>
    <rect x="640" width="560" height="420" fill="url(#grid)" opacity=".55"/>
    <rect x="640" width="560" height="420" fill="url(#fade)" transform="rotate(180 920 210)"/>

    <!-- barra da janela -->
    <rect width="1200" height="44" fill="#12161B"/>
    <line x1="0" y1="44" x2="1200" y2="44" stroke="#232A33"/>
    <circle cx="26" cy="22" r="6" fill="#232A33"/><circle cx="46" cy="22" r="6" fill="#232A33"/><circle cx="66" cy="22" r="6" fill="#232A33"/>
    <text x="600" y="27" text-anchor="middle" class="mono" font-size="13" fill="#7D8794">sola@fiap: ~</text>
    <rect class="scan" x="0" y="43" width="240" height="2" fill="url(#beam)"/>

    <!-- conteúdo -->
    <text class="mono in d1" x="64" y="104" font-size="16" fill="#7D8794"><tspan fill="#C8F135">$</tspan> whoami <tspan class="cursor" fill="#C8F135">█</tspan></text>

    <text class="mono in d2" x="64" y="146" font-size="13" letter-spacing="3" fill="#5EEAD4">DESENVOLVEDOR FRONTEND · UX</text>
    <text class="sans in d2" x="60" y="222" font-size="76" font-weight="800" letter-spacing="-3" fill="#E8ECF1">Guilherme Sola<tspan fill="#C8F135">.</tspan></text>

    <text class="sans in d3" x="64" y="270" font-size="22" fill="#E8ECF1" fill-opacity=".86">Interfaces que se movem <tspan font-style="italic">com motivo</tspan> e que qualquer pessoa consegue usar.</text>

    <g class="mono in d4" font-size="14" fill="#7D8794">
      <text x="64" y="326"><tspan fill="#C8F135">--motion</tspan>  GSAP · Three.js · R3F</text>
      <text x="380" y="326"><tspan fill="#C8F135">--mobile</tspan>  React Native · Expo</text>
      <text x="690" y="326"><tspan fill="#C8F135">--ux</tspan>  decide antes de codar</text>
    </g>

    <g class="in d5">
      <rect x="64" y="358" width="10" height="10" rx="5" fill="#C8F135"/>
      <text class="mono" x="84" y="368" font-size="13" fill="#7D8794">ADS · FIAP · último semestre  ·  São Paulo, BR</text>
    </g>

    <!-- monograma -->
    <g transform="translate(980 200)" class="in d3">
      <circle r="118" fill="none" stroke="#232A33" stroke-width="1.5"/>
      <circle r="86" fill="none" stroke="#C8F135" stroke-width="1.5" stroke-dasharray="4 8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      </circle>
      <text text-anchor="middle" y="24" class="sans" font-size="72" font-weight="800" letter-spacing="-4" fill="#E8ECF1">gs</text>
      <circle cx="44" cy="20" r="6" fill="#C8F135"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="419" rx="18" fill="none" stroke="#232A33"/>
</svg>